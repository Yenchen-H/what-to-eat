<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？拉霸機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 色彩與基本設定 ===== */
:root {
  --bg: #1b0e0a;
  --bg-2: #2a1510;
  --red: #a31d1d;
  --red-dark: #5e0f0f;
  --gold: #e6b422;
  --gold-light: #ffe08a;
  --gold-dark: #9c7410;
  --cream: #fff8e8;
  --cream-2: #f5ead0;
  --ink: #2b1a12;
  --ink-soft: #6b5446;
  --open: #2e8b3a;
  --soon: #e67e22;
  --closed: #8a8178;
  --off: #c0392b;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Noto Sans TC", system-ui, sans-serif;
  background: radial-gradient(ellipse at top, #3a1a12 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--cream);
  min-height: 100vh;
  line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; }
a { color: inherit; }

/* ===== 標題列 ===== */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 1280px; margin: 0 auto; padding: 18px 16px 8px;
}
.brand h1 {
  font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 900; letter-spacing: .04em;
  color: var(--gold-light);
  text-shadow: 0 2px 0 var(--red-dark), 0 0 18px rgba(230,180,34,.45);
}
.brand .clock { color: var(--cream-2); opacity: .8; font-size: .95rem; }
.icon-btn {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--gold); background: var(--bg-2); color: var(--gold-light);
  font-size: 1.3rem; display: grid; place-items: center;
}
.icon-btn:hover { background: var(--red-dark); }

/* ===== 版面 ===== */
main {
  max-width: 1280px; margin: 0 auto; padding: 8px 16px 40px;
  display: grid; gap: 24px; grid-template-columns: 1fr;
}
@media (min-width: 960px) {
  main { grid-template-columns: minmax(420px, 480px) 1fr; align-items: start; }
  .left { position: sticky; top: 16px; }
}
.panel-title { font-size: 1.1rem; font-weight: 700; color: var(--gold-light); margin-bottom: 10px; }

/* ===== 篩選區 ===== */
.filters {
  background: rgba(255,255,255,.04); border: 1px solid rgba(230,180,34,.3);
  border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
}
.filter-row { margin-bottom: 12px; }
.filter-row .label { font-size: .85rem; color: var(--cream-2); opacity: .75; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--gold-dark); background: transparent; color: var(--cream);
  padding: 6px 14px; border-radius: 999px; font-size: .95rem; transition: .15s;
}
.chip:hover { border-color: var(--gold); }
.chip.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 700; }
.filter-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .track {
  width: 46px; height: 26px; border-radius: 999px; background: #554; position: relative; transition: .2s;
}
.toggle .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; transition: .2s;
}
.toggle input:checked + .track { background: var(--open); }
.toggle input:checked + .track::after { left: 23px; }
.count { font-size: .95rem; color: var(--gold-light); }
.count b { font-size: 1.2rem; }
.reset { background: none; border: none; color: var(--cream-2); text-decoration: underline; opacity: .7; font-size: .85rem; }

/* ===== 拉霸機 ===== */
.machine-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; }
.machine {
  position: relative; flex: 1; max-width: 420px;
  background: linear-gradient(180deg, #c42a2a 0%, var(--red) 40%, var(--red-dark) 100%);
  border: 6px solid var(--gold); border-radius: 28px 28px 20px 20px;
  padding: 22px 18px 18px;
  box-shadow: 0 0 0 3px var(--gold-dark), 0 18px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.25);
}
.marquee {
  text-align: center; font-weight: 900; font-size: 1.35rem; letter-spacing: .3em;
  color: var(--gold-light); text-shadow: 0 0 10px rgba(255,224,138,.8);
  margin-bottom: 12px;
}
/* 跑馬燈燈泡 */
.bulbs { position: absolute; inset: 6px; pointer-events: none; }
.bulb {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: #ffe9a8; box-shadow: 0 0 6px 2px rgba(255,220,120,.8);
  animation: blink 1.2s infinite;
}
.bulb.alt { animation-delay: .6s; }
.machine.spinning .bulb { animation-duration: .25s; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.window {
  position: relative; height: calc(var(--item-h) * 3); overflow: hidden;
  background: var(--cream); border-radius: 12px;
  border: 4px solid var(--gold-dark);
  box-shadow: inset 0 10px 18px rgba(0,0,0,.35), inset 0 -10px 18px rgba(0,0,0,.35);
  --item-h: 84px;
}
.window::before, .window::after {
  content: ""; position: absolute; left: 0; right: 0; height: var(--item-h); z-index: 2; pointer-events: none;
}
.window::before { top: 0; background: linear-gradient(180deg, rgba(43,26,18,.55), rgba(43,26,18,0)); }
.window::after { bottom: 0; background: linear-gradient(0deg, rgba(43,26,18,.55), rgba(43,26,18,0)); }
.payline {
  position: absolute; left: -2px; right: -2px; top: var(--item-h); height: var(--item-h); z-index: 3;
  border-top: 3px solid var(--red); border-bottom: 3px solid var(--red); pointer-events: none;
}
.payline::before, .payline::after {
  content: ""; position: absolute; top: 50%; transform: translateY(-50%);
  border: 10px solid transparent;
}
.payline::before { left: 0; border-left-color: var(--red); }
.payline::after { right: 0; border-right-color: var(--red); }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.strip.blur { filter: blur(1.5px); }
.reel-item {
  height: var(--item-h); display: flex; align-items: center; gap: 12px; padding: 0 26px;
  color: var(--ink); border-bottom: 1px dashed rgba(107,84,70,.25);
}
.reel-item .thumb { width: 56px; height: 56px; font-size: 2rem; }
.reel-item .name { font-weight: 900; font-size: 1.15rem; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.reel-item.placeholder { justify-content: center; color: var(--ink-soft); font-weight: 700; }

.spin-btn {
  display: block; width: 100%; margin-top: 16px; padding: 14px;
  font-size: 1.35rem; font-weight: 900; letter-spacing: .15em;
  color: var(--ink); border: none; border-radius: 14px;
  background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
  box-shadow: 0 6px 0 #6b4f08, 0 10px 20px rgba(0,0,0,.4);
  transition: transform .08s, box-shadow .08s;
}
.spin-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #6b4f08, 0 4px 10px rgba(0,0,0,.4); }
.spin-btn:disabled { filter: grayscale(.6) brightness(.8); cursor: not-allowed; }
.hint { text-align: center; margin-top: 10px; min-height: 1.4em; color: var(--gold-light); font-size: .95rem; }

/* 拉桿 */
.lever {
  position: relative; width: 44px; height: 220px; border: none; background: none; flex-shrink: 0;
  align-self: center; touch-action: none;
}
.lever .base {
  position: absolute; left: 0; bottom: 40px; width: 22px; height: 70px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
  border-radius: 0 8px 8px 0;
}
.lever .arm {
  position: absolute; left: 14px; bottom: 75px; width: 12px; height: 120px;
  background: linear-gradient(90deg, #888, #eee, #888); border-radius: 6px;
  transform-origin: bottom center; transition: transform .25s cubic-bezier(.3,1.6,.6,1);
}
.lever .ball {
  position: absolute; left: -10px; top: -26px; width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8a8a, #d62020 55%, #7a0b0b);
  box-shadow: 0 4px 10px rgba(0,0,0,.5);
}
.lever.pulled .arm { transform: scaleY(-.55); transition: transform .18s ease-in; }
.lever:disabled { cursor: not-allowed; opacity: .85; }

/* ===== 縮圖（照片或預設圖示） ===== */
.thumb {
  flex-shrink: 0; border-radius: 12px; overflow: hidden; display: grid; place-items: center;
  background: var(--cream-2);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ===== 餐廳清單 ===== */
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.list-head small { color: var(--cream-2); opacity: .7; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card {
  background: var(--cream); color: var(--ink); border-radius: var(--radius);
  padding: 14px; display: flex; gap: 12px; text-align: left; border: none; width: 100%;
  box-shadow: 0 4px 14px rgba(0,0,0,.35); transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.45); }
.card.dim { opacity: .55; }
.card .thumb { width: 64px; height: 64px; font-size: 2.1rem; }
.card .info { min-width: 0; flex: 1; }
.card .name { font-weight: 700; font-size: 1.02rem; line-height: 1.35; margin-bottom: 4px; }
.card .meta { font-size: .85rem; color: var(--ink-soft); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.tag { font-size: .75rem; background: var(--cream-2); color: var(--ink); padding: 1px 8px; border-radius: 999px; }
.status { display: inline-block; font-size: .78rem; font-weight: 700; color: #fff; padding: 1px 9px; border-radius: 999px; }
.status.open { background: var(--open); }
.status.soon { background: var(--soon); }
.status.closed { background: var(--closed); }
.status.off { background: var(--off); }

/* ===== 結果卡 / 詳細資料 ===== */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(10,4,2,.75);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.overlay.show { display: flex; }
.result {
  position: relative; background: var(--cream); color: var(--ink);
  width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto;
  border-radius: 22px; border: 5px solid var(--gold);
  box-shadow: 0 0 0 3px var(--gold-dark), 0 20px 60px rgba(0,0,0,.7);
  animation: pop .35s cubic-bezier(.2,1.4,.5,1);
}
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result .ribbon {
  background: var(--red); color: var(--gold-light); text-align: center; font-weight: 900;
  letter-spacing: .2em; padding: 8px; font-size: 1.05rem;
}
.result .hero { height: 180px; width: 100%; border-radius: 0; font-size: 5rem; }
.result .body { padding: 16px 20px 20px; }
.result h2 { font-size: 1.5rem; font-weight: 900; line-height: 1.3; margin-bottom: 6px; }
.result dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0; font-size: .95rem; }
.result dt { color: var(--ink-soft); white-space: nowrap; }
.result dd { min-width: 0; }
.result .note { background: var(--cream-2); border-radius: 10px; padding: 8px 12px; font-size: .9rem; margin-bottom: 12px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions a, .actions button {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px; border-radius: 12px; font-weight: 700; font-size: 1rem; text-decoration: none; border: none;
}
.btn-call { background: var(--open); color: #fff; }
.btn-map { background: #1f6fd1; color: #fff; }
.btn-again { grid-column: 1 / -1; background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: var(--ink); }
.close-x {
  position: absolute; top: 6px; right: 8px; z-index: 2; width: 34px; height: 34px; border-radius: 50%;
  border: none; background: rgba(0,0,0,.35); color: #fff; font-size: 1.1rem;
}

footer { text-align: center; font-size: .8rem; opacity: .5; padding: 0 16px 24px; }

@media (max-width: 480px) {
  .window { --item-h: 72px; }
  .reel-item { padding: 0 18px; }
  .reel-item .thumb { width: 48px; height: 48px; font-size: 1.7rem; }
  .reel-item .name { font-size: 1.02rem; }
  .lever { width: 36px; }
  .machine { padding: 18px 12px 14px; }
  .result .hero { height: 110px; font-size: 3.6rem; }
  .result .body { padding: 14px 16px 16px; }
}
</style>
</head>

    <div class="clock" id="clock"></div>

</header>

<main>

        <span class="base"></span>
        <span class="arm"><span class="ball"></span></span>

  </section>

  <!-- 餐廳清單 -->
  <section>
    <div class="list-head">

    <div class="grid" id="list"></div>
  </section>
</main>

<footer>點餐廳卡片可以看詳細資料｜營業時間依 Google 資料整理，國定假日可能不同</footer>

<!-- 結果卡 -->
<div class="overlay" id="overlay">
  <div class="result" id="result" role="dialog" aria-modal="true"></div>
</div>

const DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const DAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];
const SOON_MINUTES = 30;
const SPIN_MS = 3200;

// ===== 營業狀態判斷 =====
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

// 把今天（和昨天跨夜延續過來）的時段，轉成「以今天 0 點為起點」的分鐘區間
function todayRanges(r, now) {
  const d = now.getDay();
  const ranges = [];
  for (const [s, e] of (r.hours[DAY_KEYS[d]] || [])) {
    let a = toMin(s), b = toMin(e);
    if (b <= a) b += 1440;
    ranges.push([a, b]);
  }
  for (const [s, e] of (r.hours[DAY_KEYS[(d + 6) % 7]] || [])) {
    const a = toMin(s), b = toMin(e);
    if (b <= a) ranges.push([a - 1440, b]);
  }
  return ranges;
}

function getStatus(r, now = new Date()) {
  const m = now.getHours() * 60 + now.getMinutes();
  const ranges = todayRanges(r, now);
  for (const [a, b] of ranges) {
    if (m >= a && m < b) {
      return b - m <= SOON_MINUTES
        ? { key: "soon", text: `即將打烊（${b - m} 分）`, open: true }
        : { key: "open", text: "營業中", open: true };
    }
  }
  const todays = r.hours[DAY_KEYS[now.getDay()]] || [];
  if (todays.length === 0) return { key: "off", text: "今日公休", open: false };
  const later = ranges.filter(([a]) => a > m).sort((x, y) => x[0] - y[0])[0];
  if (later) return { key: "closed", text: `尚未營業（${fmtMin(later[0])} 開）`, open: false };
  return { key: "closed", text: "已打烊", open: false };
}
const fmtMin = v => `${String(Math.floor(v / 60) % 24).padStart(2, "0")}:${String(v % 60).padStart(2, "0")}`;

function todayHoursText(r, now = new Date()) {
  const list = r.hours[DAY_KEYS[now.getDay()]] || [];
  if (list.length === 0) return "今日公休";
  return list.map(([s, e]) => `${s}–${e}`).join("、");
}

function weekHoursHTML(r) {
  const order = [1, 2, 3, 4, 5, 6, 0];
  const today = new Date().getDay();
  return order.map(d => {
    const list = r.hours[DAY_KEYS[d]] || [];
    const txt = list.length ? list.map(([s, e]) => `${s}–${e}`).join("、") : "公休";
    const style = d === today ? ' style="font-weight:700;color:var(--red)"' : "";
    return `<div${style}>週${DAY_NAMES[d]}　${txt}</div>`;
  }).join("");
}

// ===== 小工具 =====
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function thumbHTML(r) {
  const icon = iconOf(r);

  return `<img src="images/${esc(r.image)}" alt="${esc(r.name)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${icon}'))">`;
}
function formatPhone(p) {
  if (!p) return "";
  if (/^09\d{8}$/.test(p)) return `${p.slice(0, 4)}-${p.slice(4, 7)}-${p.slice(7)}`;
  if (/^0\d{8}$/.test(p)) return `${p.slice(0, 2)}-${p.slice(2, 5)}-${p.slice(5)}`;
  return p;
}

// ===== 篩選 =====
function matchFilters(r, now) {
  if (state.cats.size && !r.categories.some(c => state.cats.has(c))) return false;
  if (state.prices.size && !state.prices.has(r.priceLevel)) return false;
  if (state.openOnly && !getStatus(r, now).open) return false;
  return true;
}
const candidates = () => { const now = new Date(); return RESTAURANTS.filter(r => matchFilters(r, now)); };

// ===== 拉霸機滾輪 =====
const reelItemHTML = r => r
  ? `<div class="reel-item"><div class="thumb">${thumbHTML(r)}</div><div class="name">${esc(r.name)}</div></div>`
  : `<div class="reel-item placeholder">？？？</div>`;
const itemH = () => parseFloat(getComputedStyle($("window")).getPropertyValue("--item-h")) || 84;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function idleReel() {
  const a = pick(RESTAURANTS), b = pick(RESTAURANTS);
  $("strip").innerHTML = reelItemHTML(a) + reelItemHTML(null) + reelItemHTML(b);
  $("strip").style.transform = "translateY(0px)";
  state.current = null;
}

function spin() {
  if (state.spinning) return;
  const pool = candidates();
  if (pool.length === 0) {
    $("hint").textContent = "沒有符合條件的餐廳，放寬一下篩選吧";
    sound.buzz();
    return;
  }
  sound.unlock();
  state.spinning = true;
  setBusy(true);
  $("hint").textContent = "";

  const target = pick(pool);
  const COUNT = 36;
  const seq = [pick(RESTAURANTS), state.current];
  for (let i = 0; i < COUNT; i++) seq.push(pick(pool));
  seq.push(target, pick(pool));
  $("strip").innerHTML = seq.map(reelItemHTML).join("");

  const h = itemH();
  const startY = 0;                         // seq[1] 在中間那格
  const endY = -(seq.length - 3) * h;       // target 在中間那格
  const strip = $("strip");
  const t0 = performance.now();
  let lastIdx = 0;
  const ease = t => 1 - Math.pow(1 - t, 4);

  function frame(now) {
    const t = Math.min(1, (now - t0) / SPIN_MS);
    const y = startY + (endY - startY) * ease(t);
    strip.style.transform = `translateY(${y}px)`;
    const idx = Math.floor(-y / h + 0.5);
    if (idx !== lastIdx) { lastIdx = idx; sound.tick(); }
    strip.classList.toggle("blur", t < 0.55);
    if (t < 1) requestAnimationFrame(frame);
    else finish(target);
  }
  requestAnimationFrame(frame);
}

function finish(r) {
  state.spinning = false;
  state.current = r;
  setBusy(false);
  sound.ding();
  setTimeout(() => showResult(r, true), 350);
}

function setBusy(b) {
  $("spinBtn").disabled = b;
  $("lever").disabled = b;
  $("machine").classList.toggle("spinning", b);
}

function buildBulbs() {
  const box = $("bulbs");
  const w = box.clientWidth, h = box.clientHeight, gap = 26;
  const html = [];
  let k = 0;
  const put = (x, y) => html.push(`<span class="bulb ${k++ % 2 ? "alt" : ""}" style="left:${x - 4.5}px;top:${y - 4.5}px"></span>`);
  for (let x = 14; x <= w - 14; x += gap) { put(x, 0); put(x, h); }
  for (let y = gap; y <= h - gap; y += gap) { put(0, y); put(w, y); }
  box.innerHTML = html.join("");
}

// ===== 音效（Web Audio API 即時產生，不需要音檔） =====
const sound = (() => {
  let ctx = null, noiseBuf = null;
  const unlock = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
  };
  const ok = () => ctx && !state.muted;
  const tone = (freq, start, dur, type = "triangle", vol = 0.2) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.connect(g).connect(ctx.destination);
    o.start(start); o.stop(start + dur + 0.02);
  };
  return {
    unlock,
    tick() {   // 轉輪「喀」
      if (!ok()) return;
      const t = ctx.currentTime;
      tone(1500 + Math.random() * 300, t, 0.035, "square", 0.05);
    },
    ding() {   // 停止「叮！」
      if (!ok()) return;
      const t = ctx.currentTime;
      [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.09, 0.6, "triangle", 0.18));
      tone(2093, t + 0.36, 1.0, "sine", 0.12);
    },
    clank() {  // 拉桿「喀鏘」
      if (!ok()) return;
      const t = ctx.currentTime;
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = 2200; f.Q.value = 1.2;
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      src.connect(f).connect(g).connect(ctx.destination); src.start(t); src.stop(t + 0.2);
      const o = ctx.createOscillator(), g2 = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.2);
      g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g2).connect(ctx.destination); o.start(t); o.stop(t + 0.3);
    },
    buzz() {   // 沒有符合的店
      unlock(); if (!ok()) return;
      const t = ctx.currentTime;
      tone(140, t, 0.25, "sawtooth", 0.12); tone(110, t + 0.22, 0.3, "sawtooth", 0.12);
    }
  };
})();

function setupMute() {
  try { state.muted = localStorage.getItem("eat-muted") === "1"; } catch (e) {}
  const paint = () => $("muteBtn").textContent = state.muted ? "🔇" : "🔊";
  paint();
  $("muteBtn").addEventListener("click", () => {
    state.muted = !state.muted; paint();
    try { localStorage.setItem("eat-muted", state.muted ? "1" : "0"); } catch (e) {}
    if (!state.muted) { sound.unlock(); sound.tick(); }
  });
}

// ===== 時鐘 =====
function tickClock() {
  const n = new Date();
  $("clock").textContent = `${n.getFullYear()}/${n.getMonth() + 1}/${n.getDate()}（${DAY_NAMES[n.getDay()]}）${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
}

// ===== 啟動 =====
buildChips();
setupLever();
setupMute();
idleReel();
buildBulbs();
tickClock();
refresh();
setInterval(() => { tickClock(); if (!state.spinning) refresh(); }, 30000);
window.addEventListener("resize", buildBulbs);
$("list").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c || state.spinning) return;
  showResult(RESTAURANTS[Number(c.dataset.idx)], false);
});
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeResult(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeResult(); });
</script>
</body>
</html>
